<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vTTW 虛擬台灣虎航 - 飛行員筆試系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景浮水印 -->
    <div class="watermark"></div>

    <div class="container">
        <header>
            <h1>🐯 虛擬台灣虎航 (vTTW) 飛行員筆試系統</h1>
            <div id="timer" class="hidden">✈️ 剩餘時間：<span id="time-display">30:00</span></div>
        </header>

        <main>
            <!-- 畫面零：考生資訊登錄 -->
            <section id="candidate-screen">
                <div class="info-box candidate-form">
                    <div class="form-row">
                        <label>考生姓名：</label>
                        <input type="text" id="candidate-name" placeholder="如：王ＯＯ" required>
                    </div>
                    <div class="form-row alt-bg">
                        <label>證號：</label>
                        <input type="text" id="candidate-id" placeholder="如：Z198765598 或 VID" required>
                    </div>
                    <div class="form-row">
                        <label>生日：</label>
                        <input type="date" id="candidate-dob">
                    </div>
                    <div class="form-row alt-bg">
                        <label>考別：</label>
                        <span>虛擬飛行員</span>
                    </div>
                    <div class="form-row">
                        <label>照類：</label>
                        <span>A320 Type Rating</span>
                    </div>
                    <div class="form-row alt-bg">
                        <label>考試類型：</label>
                        <span class="text-red">筆試 (中)</span>
                    </div>
                    <button id="confirm-info-btn" class="tiger-btn">確定</button>
                </div>
            </section>

            <!-- 畫面一：開始畫面 (預設隱藏) -->
            <section id="start-screen" class="hidden">
                <div class="info-box">
                    <p><strong>考試規則與說明：</strong></p>
                    <p>本測驗為 vTTW 飛行員資格筆試，請於限時內完成。送出後將即時結算分數與 vAMSYS / A320 相關規範解析。</p>
                </div>
                <button id="start-btn" class="tiger-btn">開始測驗</button>
            </section>

            <!-- 畫面二：測驗畫面 (預設隱藏) -->
            <section id="quiz-screen" class="hidden">
                <div id="questions-container">
                    <!-- 題目由 JS 動態生成於此 -->
                </div>
                <button id="submit-btn" class="tiger-btn submit">📤 確定交卷</button>
            </section>

            <!-- 畫面三：結果畫面 (預設隱藏，交卷後才顯示) -->
            <section id="result-screen" class="hidden">
                <div class="result-box">
                    <h2>測驗結果</h2>
                    <!-- 顯示考生姓名與分數 -->
                    <div id="result-candidate-info" style="font-size: 1.2rem; margin-bottom: 10px; color: #aaa;"></div>
                    <div id="score-display" class="score"></div>
                    <button id="retry-btn" class="tiger-btn">重新挑戰</button>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
